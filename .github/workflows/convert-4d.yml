name: 4D 모델 변환(SVF→GLB)

# 4D 공정관리 자체 뷰어용: ACC 모델(SVF)을 glTF/GLB 로 변환해 Supabase Storage 에
# 올린다. 대형 모델 변환은 Vercel 서버리스 한도를 넘으므로 여기(러너: 7GB/14GB/6h)서
# 1회 실행한다. 수동 트리거(workflow_dispatch).
#
# 필요한 레포 Secrets (Settings → Secrets and variables → Actions):
#   APS_CLIENT_ID, APS_CLIENT_SECRET, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
on:
  workflow_dispatch:
    inputs:
      project_id:
        description: '대상 프로젝트 ID (projects.acc_4d_urn 을 읽어 변환)'
        required: false
        default: ''
      urn:
        description: '직접 URN 지정(선택 — project_id 보다 우선)'
        required: false
        default: ''
      region:
        description: 'APS 리전 (US / EMEA / AUS)'
        required: false
        default: 'US'
      include_lines:
        description: "선/점 포함 여부('1'=포함(DWG 등), '0'=엣지선 제외(IFC/RVT/NWD))"
        required: false
        default: ''
      render_test:
        description: "'1'이면 변환 후 헤드리스 xeokit 렌더 진단(ASCII 로그) 실행"
        required: false
        default: ''
      dxf_test:
        description: "'1'이면 SVF 대신 원본 DWG→DXF 변환 검증(project/item 필요)"
        required: false
        default: ''
      project:
        description: 'DXF검증용 ACC 프로젝트 ID (b.xxxx)'
        required: false
        default: ''
      item:
        description: 'DXF검증용 ACC 아이템 ID (urn:adsk.wipprod:dm.lineage:…)'
        required: false
        default: ''
      landxml_project:
        description: '(선택) 지표면 LandXML ACC 프로젝트 ID (b.xxxx) — 진짜 Civil3D TIN 병합용'
        required: false
        default: ''
      landxml_item:
        description: '(선택) 지표면 LandXML ACC 아이템 ID (urn:adsk.wipprod:dm.lineage:…)'
        required: false
        default: ''

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ===== 자체 DWG 파이프라인 검증(SVF 미경유): DWG→DXF→진단 =====
      - name: (DXF) 원본 DWG 다운로드
        if: github.event.inputs.dxf_test == '1'
        env:
          APS_CLIENT_ID: ${{ secrets.APS_CLIENT_ID }}
          APS_CLIENT_SECRET: ${{ secrets.APS_CLIENT_SECRET }}
          PROJECT: ${{ github.event.inputs.project }}
          ITEM: ${{ github.event.inputs.item }}
        run: node scripts/fetchDwg.mjs

      - name: (DXF) LibreDWG 설치 + DWG→DXF
        if: github.event.inputs.dxf_test == '1'
        continue-on-error: true
        run: |
          set -x
          sudo apt-get update -qq
          if sudo apt-get install -y libredwg-tools 2>/dev/null && command -v dwg2dxf; then
            echo "apt libredwg-tools OK"
          else
            echo "apt 실패 → 소스 빌드"
            sudo apt-get install -y git build-essential libtool automake autoconf pkg-config texinfo || true
            git clone --depth 1 https://github.com/LibreDWG/libredwg.git /tmp/libredwg
            cd /tmp/libredwg && sh autogen.sh && ./configure --disable-bindings --disable-docs && make -j"$(nproc)"
            cd "$GITHUB_WORKSPACE"
          fi
          # dwg2dxf 는 libtool 래퍼 → 빌드 폴더 내(.libs 옆)에서 실행해야 동작.
          DWG2DXF=$(command -v dwg2dxf || echo /tmp/libredwg/programs/dwg2dxf)
          echo "using $DWG2DXF"
          "$DWG2DXF" --version 2>&1 | head -3 || true
          # 174MB AutoCAD2018 파일 — 변환 로그를 남긴다(마지막 40줄).
          "$DWG2DXF" -y -o out/original.dxf out/original.dwg 2>dxf_err.log || "$DWG2DXF" out/original.dwg out/original.dxf 2>dxf_err.log || echo "변환 실패"
          echo "--- dwg2dxf stderr(마지막 40줄) ---"; tail -40 dxf_err.log || true
          ls -la out/ || true

      - name: (DXF) 내용 진단
        if: github.event.inputs.dxf_test == '1'
        continue-on-error: true
        run: |
          npm install --no-save dxf-parser
          node scripts/dxfInspect.mjs out/original.dxf || echo "진단 실패"

      # (선택) 진짜 Civil3D 지표면 — LandXML 을 ACC 에서 받아 dxfToGlb 가 병합(DXF_LANDXML).
      - name: (DXF) 지표면 LandXML 다운로드(선택)
        if: github.event.inputs.dxf_test == '1' && github.event.inputs.landxml_item != ''
        continue-on-error: true
        env:
          APS_CLIENT_ID: ${{ secrets.APS_CLIENT_ID }}
          APS_CLIENT_SECRET: ${{ secrets.APS_CLIENT_SECRET }}
          LANDXML_PROJECT: ${{ github.event.inputs.landxml_project }}
          LANDXML_ITEM: ${{ github.event.inputs.landxml_item }}
        run: node scripts/fetchLandxml.mjs

      - name: (DXF) DXF → GLB
        if: github.event.inputs.dxf_test == '1'
        continue-on-error: true
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'
          # 있으면 진짜 Civil3D 지표면(TIN)을 병합. 없으면 조용히 선형만.
          DXF_LANDXML: out/surface.xml
        run: |
          # 문자(TEXT/MTEXT) 한글 렌더용 아웃라인 폰트 + opentype.js.
          sudo apt-get install -y fonts-nanum fonts-noto-cjk >/dev/null 2>&1 || true
          npm install --no-save opentype.js >/dev/null 2>&1 || true
          node scripts/dxfToGlb.mjs out/original.dxf out/model.glb

      - name: (DXF) 헤드리스 렌더 확인(render_test 일 때만)
        if: github.event.inputs.dxf_test == '1' && github.event.inputs.render_test == '1'
        continue-on-error: true
        run: |
          npm install --no-save @xeokit/xeokit-sdk@2 playwright-core pngjs
          npx playwright install --with-deps chromium
          node scripts/renderDiag.mjs out/model.glb

      - name: (DXF) GLB → R2 업로드(앱이 로드) · 실패 시 마커
        if: always() && github.event.inputs.dxf_test == '1'
        env:
          URN: ${{ github.event.inputs.urn }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          npm install --no-save @aws-sdk/client-s3@3
          node scripts/uploadDxfGlb.mjs

      - name: (DXF) DXF 아티팩트 업로드(백업)
        if: always() && github.event.inputs.dxf_test == '1'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dwg-dxf
          path: out/original.dxf
          if-no-files-found: ignore

      # ===== 기존 SVF→GLB 경로(dxf_test 아닐 때만) =====
      - name: Install converter deps
        if: github.event.inputs.dxf_test != '1'
        run: npm install --no-save svf-utils@8 @supabase/supabase-js@2 @aps_sdk/authentication @aps_sdk/model-derivative adm-zip meshoptimizer gltf-pipeline@4 @aws-sdk/client-s3@3 @xeokit/xeokit-convert@1 @loaders.gl/polyfills@4.3.4 sharp@0.35.4

      - name: Convert SVF → GLB → upload
        if: github.event.inputs.dxf_test != '1'
        env:
          # 통합 NWD(2억+ 삼각형)까지 견디게 힙 상향(러너 RAM 16GB). 전역 삼각형 예산
          # (mergeGlb MERGE_TRI_BUDGET, 기본 1천만)이 실제 메모리를 눌러주는 주 장치.
          NODE_OPTIONS: '--max-old-space-size=12288'
          APS_CLIENT_ID: ${{ secrets.APS_CLIENT_ID }}
          APS_CLIENT_SECRET: ${{ secrets.APS_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PROJECT_ID: ${{ github.event.inputs.project_id }}
          URN: ${{ github.event.inputs.urn }}
          APS_REGION: ${{ github.event.inputs.region }}
          INCLUDE_LINES: ${{ github.event.inputs.include_lines }}
          RENDER_TEST: ${{ github.event.inputs.render_test }}
        run: node scripts/convert4d.mjs

      - name: Headless xeokit 렌더 진단 (LOD1 오블리크 · base64 PNG 로그)
        if: github.event.inputs.render_test == '1'
        continue-on-error: true
        env:
          PW_OBLIQUE: '1'
        run: |
          npm install --no-save @xeokit/xeokit-sdk@2 playwright-core pngjs
          npx playwright install --with-deps chromium
          # XKT 경로는 out/xkt/lod1.glb(개요)를 렌더(RENDER_TEST 시 삭제 안 함). 없으면 model.glb.
          if [ -f out/xkt/lod1.glb ]; then node scripts/renderDiag.mjs out/xkt/lod1.glb; else node scripts/renderDiag.mjs out/model.glb; fi

      - name: Headless xeokit 텍스처 렌더 검증 (c0 청크 · 지형 항공사진 · top-down)
        if: github.event.inputs.render_test == '1'
        continue-on-error: true
        env:
          PW_NO_FOCUS: '1'
          # 대용량 텍스처 청크는 소프트웨어 GL 에서 Basis 트랜스코딩·렌더가 느리다 → 넉넉히 대기.
          PW_SETTLE_MS: '9000'
          PW_WAIT_MS: '150000'
          PW_SHOT_MS: '180000'
        run: |
          # 첫 청크 c0.xkt(지형 텍스처 프래그)를 앱과 동일한 KTX2 트랜스코더(self-host /basis/)로
          # 렌더 → 항공사진이 실제로 디코드/맵핑되면 회색이 아닌 갈색·녹색 등 다채색이 나온다.
          if [ -f out/xkt/c0.xkt ]; then node scripts/renderDiag.mjs out/xkt/c0.xkt; else echo "c0.xkt 없음 — 텍스처 렌더 검증 건너뜀"; fi

      - name: Upload glb as workflow artifact (백업)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: model-glb
          path: out/model.glb
          if-no-files-found: ignore
