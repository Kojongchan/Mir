name: DWG→DXF 검증(SVF 미경유 자체변환 1단계)

# 원본 DWG 를 ACC 에서 직접 받아 무료 툴로 DXF 변환 → 진짜 객체(호·선종류·선가중치·TIN)가
# 얼마나 살아있는지 확인한다. 자체 DWG 파이프라인(SVF 미경유)의 타당성 검증용.
on:
  workflow_dispatch:
    inputs:
      project:
        description: 'ACC 프로젝트 ID (b.xxxx…)'
        required: true
      item:
        description: 'ACC 아이템 ID (urn:adsk.wipprod:dm.lineage:…)'
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 원본 DWG 다운로드
        env:
          APS_CLIENT_ID: ${{ secrets.APS_CLIENT_ID }}
          APS_CLIENT_SECRET: ${{ secrets.APS_CLIENT_SECRET }}
          PROJECT: ${{ github.event.inputs.project }}
          ITEM: ${{ github.event.inputs.item }}
        run: node scripts/fetchDwg.mjs

      - name: LibreDWG 설치(무료·무로그인) — dwg2dxf
        run: |
          set -e
          # 1) apt 에 있으면 바로.
          sudo apt-get update -qq
          if sudo apt-get install -y libredwg-tools 2>/dev/null && command -v dwg2dxf; then
            echo "apt libredwg-tools OK"
          else
            echo "apt 실패 → 소스 빌드"
            sudo apt-get install -y git build-essential libtool automake autoconf pkg-config texinfo
            git clone --depth 1 https://github.com/LibreDWG/libredwg.git /tmp/libredwg
            cd /tmp/libredwg && sh autogen.sh && ./configure --disable-bindings --disable-docs && make -j"$(nproc)"
            sudo cp programs/dwg2dxf /usr/local/bin/ || cp programs/dwg2dxf "$GITHUB_WORKSPACE/dwg2dxf"
          fi

      - name: DWG → DXF
        continue-on-error: true
        run: |
          DWG2DXF=$(command -v dwg2dxf || echo ./dwg2dxf)
          echo "using $DWG2DXF"
          "$DWG2DXF" --version || true
          "$DWG2DXF" -o out/original.dxf out/original.dwg || "$DWG2DXF" out/original.dwg out/original.dxf || echo "변환 실패"
          ls -la out/ || true
          head -c 400 out/original.dxf 2>/dev/null || echo "(DXF 없음)"

      - name: DXF 내용 진단
        continue-on-error: true
        run: |
          npm install --no-save dxf-parser
          node scripts/dxfInspect.mjs out/original.dxf || echo "진단 실패"

      - name: DXF 아티팩트 업로드(백업)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dwg-dxf
          path: |
            out/original.dxf
          if-no-files-found: ignore
