name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run on any branch from the Actions tab (verify a feature branch before opening a PR).
  workflow_dispatch:

jobs:
  build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (app + api)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Builds against a fake Supabase host and walks every menu as a mocked admin.
      - name: Browser smoke test
        run: npm run test:e2e
